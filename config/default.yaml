# Every parameter that can change results lives here; .env holds only secrets/endpoints.
corpus:
  path: data/raw/ren1000_law_content.html
  url: https://leis.org/institucionais/br/aneel/lei/resolucao-normativa/2021/1000/resolucao-normativa-n-1000-2021-estabelece-as-regras-de-prestacao-do-servico-publico-de-distribuicao-de-energia-eletrica-revoga-as-resolucoes-normativas-aneel-n-414-de-9-de-setembro-de-2010-n-470-de-13-de-dezembro-de-2011-n-901-de-8-de-dezembro-de-2020-e-da-outras-providencias
  fragment_min_words: 6                # deep-link text-fragment prefix, extended until unique

models:
  generator: gemini-3.8-flash          # also used by grade_context in the MVP
  judge: gemini-3.1-pro-preview        # preview model: risk accepted, see ADR-006
  embedding: BAAI/bge-m3
  reranker: BAAI/bge-reranker-v2-m3

embedding:
  batch_size: 8
  max_length: 2048                     # tokens; longest structural chunk is ~1.3k tokens
  rerank_max_length: 2048              # FlagReranker default (512) would truncate chunks

qdrant:
  collection: ren1000_v1

retrieval:
  mode: hybrid+rerank                  # dense | sparse | hybrid | hybrid+rerank
  k_dense: 20                          # dense prefetch
  k_sparse: 20                         # sparse prefetch
  k_candidates: 20                     # fused candidates passed to the reranker
  k_final: 5                           # results returned by every mode
  include_revoked: false
  include_annexes: false

chunking:
  strategy: structural                 # structural | fixed
  max_chars: 3000                      # structural: split articles longer than this
  fixed_size: 1000                     # fixed (ablation only): window size in characters
  fixed_overlap: 200

generation:
  temperature: 0
  max_citation_retries: 1

citations:
  min_quote_chars: 20
  max_quote_chars: 300
