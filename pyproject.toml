[project]
name = "aneel-rag"
version = "0.1.0"
description = "Citation-grounded RAG over ANEEL Normative Resolution 1,000/2021 (personal portfolio project)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "qdrant-client>=1.12",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pre-commit>=3.8",
]
# Heavy local-only groups; CI never installs these.
ml = [
    "torch>=2.4",
    "FlagEmbedding>=1.3",
]
eval = [
    "ragas>=0.2",
]
demo = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "gradio>=4.44",
    "langfuse>=2.50",
]

[tool.uv]
default-groups = ["dev"]

# CPU-only PyTorch wheels: avoids pulling multi-GB CUDA packages.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aneel_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: needs network/API keys; skipped in CI",
]
addopts = "-m 'not smoke'"
